defaults:
  - _self_

eval_mode: ''

# Experiment related
exp_name: 'default'
seed: 0
epochs: 50
batch_size: 10
val_batch_size: 4
num_workers: 16
val_num_workers: 16
num_sanity_val_steps: 100
accumulate_grad_batches: 1
wandb: False
log_dir: Null
limit_train_batches: -1
limit_val_batches: -1
prefetch_factor: 2
ckpt: Null
eval: False
pretrain: Null
CKPT_LOAD_MODE: legacy_merge
deterministic: False
detect_anomaly: False
check_val_every_n_epoch: 1
DDP_STRATEGY_OVERRIDE: ""
DDP_FIRST_STEP_TRACE: false
DATALOADER_MULTIPROCESSING_CONTEXT: ""

eval_backward_model: False


# Turn both on when training TG to match TrafficGen's metrics.
LIMIT_MAP_RANGE: False
FOLLOW_TRAFFICGEN: False
FORCE_SDC_FOR_TRAFFICGEN: False
ONLY_LANE_FOR_TRAFFICGEN: False

# True then agent info will not be used in encoder,
# and new tokens for history will be added for decoder.
GPT_STYLE: false
REMOVE_AGENT_FROM_SCENE_ENCODER: false
USE_DIFFUSION: false
USE_ADALN: false
BACKWARD_PREDICTION: false

ADD_CONTOUR_RELATION: false

DELTA_TOKENIZER_FILE_NAME: "1030_argsort_less_256_128_128.pkl"


USE_TRAFFICGEN: false
USE_MOTION: true

EVAL_MOTION: true
EVAL_TRAFFICGEN: false

DELTA_POS_IS_VELOCITY: false

SIMPLE_RELATION: false
SIMPLE_RELATION_FACTOR: 1

RECONSTRUCT_MAP: false

UPDATE_RELATION: false

REMOVE_REL_NORM: false

DATA:
    TRAINING_DATA_DIR: '/data/datasets/scenarionet/waymo/training'
    TEST_DATA_DIR: '/data/datasets/scenarionet/waymo/validation'
    ADV_INFO_PATH: 'data/all_adv.pkl'
    SAMPLE_INTERVAL_TRAINING: 1
    SAMPLE_INTERVAL_TEST: 1
    SD_PASSTHROUGH: false
    ALLOW_CACHE: false
    RETURN_HALFWAY: false  # Only used when generating LMDB dataset
    USE_LMDB: false
    USE_CACHE: false
    COUNTERFACTUAL_CONTROL_CODE_DIR: ''
    COUNTERFACTUAL_CONTROL_INDEX: ''
    COUNTERFACTUAL_CONTROL_CODE_DIR_TRAIN: ''
    COUNTERFACTUAL_CONTROL_CODE_DIR_VAL: ''
    COUNTERFACTUAL_CONTROL_INDEX_TRAIN: ''
    COUNTERFACTUAL_CONTROL_INDEX_VAL: ''
    COUNTERFACTUAL_MODE: 'default'
    COUNTERFACTUAL_ALT_ONLY_TRAIN: false
    COUNTERFACTUAL_SEMANTIC_RL_INCLUDE_GT_ROWS: false
    COUNTERFACTUAL_WEIGHTED_SAMPLER: false
    COUNTERFACTUAL_USE_VLM_SEMANTICS: false
    COUNTERFACTUAL_VLM_CONFIDENCE_THRESHOLD: 0.75
    COUNTERFACTUAL_SDC_INCLUDE_STOP: true

PREPROCESSING:
    MAX_VECTORS: 128
    MAX_MAP_FEATURES: 512
    MAX_LENGTH_PER_MAP_FEATURE: 10000  # Useless
    MAX_AGENTS: 128
    MAX_TRAFFIC_LIGHTS: 64
    PADDING_TO_MAX: false
    keep_all_data: false # for debug
    ADD_SDC_TO_OBJECT_OF_INTEREST: true  # Should be True when WOSAC
    REMOVE_TRAFFIC_LIGHT_STATE: false

TRAINING:
    PREDICT_ALL_AGENTS: true

EVALUATION:
    NAME: 'waymo_motion_prediction'
    PREDICT_ALL_AGENTS: false
    DELETE_EVAL_RESULT: true
    NUM_MODES: 6
    MAXIMUM_BATCH_SIZE: 10000
    USE_CACHE: true

MODEL:
    NAME: 'motionlm'
    D_MODEL: 256
    LOCAL_CONTROL_FORWARD_ENABLED: false
    LOCAL_CONTROL_FORWARD_MODE: 'interactive'
    LOCAL_CONTROL_USE_PATH: true
    LOCAL_CONTROL_USE_ANCHOR: true
    LOCAL_CONTROL_USE_COMPLIANCE: true
    LOCAL_CONTROL_USE_TIMING: true
    LOCAL_CONTROL_NULL_DROPOUT_PROB: 0.2
    LOCAL_CONTROL_PATH_LOSS_WEIGHT: 0.2
    LOCAL_CONTROL_COMPLIANCE_LOSS_WEIGHT: 0.1
    LOCAL_CONTROL_TIMING_LOSS_WEIGHT: 0.1
    LOCAL_CONTROL_ANCHOR_LOSS_WEIGHT: 0.1
    LOCAL_CONTROL_FREEZE_BACKBONE: false
    LOCAL_CONTROL_TRAIN_LAST_N_DECODER_BLOCKS: 0
    LOCAL_CONTROL_TRAIN_OUTPUT_HEAD: false
    LOCAL_CONTROL_SDC_PATH_PROX_LOSS_WEIGHT: 0.2
    LOCAL_CONTROL_SDC_PATH_HEADING_LOSS_WEIGHT: 0.1
    LOCAL_CONTROL_SDC_PATH_PROGRESS_LOSS_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_POLICY_KL_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_POLICY_TEACHER_CKPT: ''
    LOCAL_CONTROL_SDC_PATH_DEADBAND_M: 1.0
    LOCAL_CONTROL_SDC_PATH_HEADING_BETA_RAD: 0.35
    LOCAL_CONTROL_SDC_PATH_PROGRESS_BACKWARD_SLACK_M: 0.25
    LOCAL_CONTROL_SDC_STEM_LOSS_WEIGHT: 1.0
    LOCAL_CONTROL_SDC_FAMILY_GUIDE_LOSS_WEIGHT: 0.2
    LOCAL_CONTROL_SDC_SEMANTIC_AUX_LOSS_WEIGHT: 0.2
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_KL_WEIGHT_GT: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_KL_WEIGHT_ALT: 0.02
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_STALL_WEIGHT: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_STALL_GRACE_STEPS: 8
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_STALL_WINDOW_STEPS: 8
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_STALL_MIN_ADVANCE_M: 0.5
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_FLOOR_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_FLOOR_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_CAP_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_CAP_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_CAP_MARGIN_MPS: 2.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_NEARBY_RADIUS_M: 30.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_EXPAND_FACTOR: 2.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_MAX_EXPANSION_STEPS: 3
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_MIN_MOVING_SPEED_MPS: 1.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_REFERENCE_RATIO: 0.60
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_MAX_REFERENCE_MPS: 12.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_MIN_NEIGHBORS: 1
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_SDC_USE_PROGRESS_ARC: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_TRAFFIC_SPEED_SDC_PROGRESS_WINDOW_STEPS: 4
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_CENTER_CURRICULUM_START_FRAC: 0.67
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_CENTER_WEIGHT_MAX: 0.03
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_CONSENSUS_WEIGHT: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_CONSENSUS_CLUSTER_RADIUS: 0.75
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_MODEL_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_HIDDEN_DIM: 64
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_EMBED_DIM: 32
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_SEMANTIC_CE_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_BRANCH_CE_WEIGHT: 0.025
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_COMPLIANCE_CE_WEIGHT: 0.025
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_TIMING_CE_WEIGHT: 0.025
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_BEHAVIOR_DAG_ALIGN_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_BASE_WEIGHT: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_EMA_DECAY: 0.995
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_MIN_VAR: 0.001
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_WARMUP_COUNT: 32
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_NOVELTY_STD_CLAMP: 2.0
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_ENABLED: false
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_K_ALPHA: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_K_ETA: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_BASE: 0.40
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_STOP: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_CONFLICT_BONUS: 0.25
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_AFTER_CONFLICT_BONUS: 0.15
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_TURN_BONUS: 0.05
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_PERMISSIVE_SIGNAL_BONUS: 0.10
    LOCAL_CONTROL_SDC_SEMANTIC_EXT_THERMOSTAT_TARGET_VIOLATION_PENALTY: 0.10
    LOCAL_CONTROL_SDC_FAMILY_GUIDE_BANDWIDTH_M: 6.0
    LOCAL_CONTROL_SDC_FAMILY_PATH_DEADBAND_M: 1.0
    LOCAL_CONTROL_SDC_FAMILY_HEADING_DEADBAND_RAD: 0.25
    LOCAL_CONTROL_SDC_FAMILY_HEADING_BETA_RAD: 0.35
    LOCAL_CONTROL_SDC_FAMILY_BACKWARD_SLACK_M: 0.25
    LOCAL_CONTROL_SDC_FAMILY_GUIDE_TEMPERATURE: 1.0
    LOCAL_CONTROL_SDC_FAMILY_PATH_PROX_WEIGHT: 1.0
    LOCAL_CONTROL_SDC_FAMILY_HEADING_WEIGHT: 0.75
    LOCAL_CONTROL_SDC_FAMILY_BACKWARD_WEIGHT: 0.5
    LOCAL_CONTROL_SDC_FAMILY_CONFIDENCE_WEIGHTED: false
    LOCAL_CONTROL_GRAD_CLIP_NORM: 1.0
    NUM_ATTN_LAYERS: 4
    NUM_ATTN_HEAD: 8
    DROPOUT_OF_ATTN: 0.0
    DROPOUT: 0.0
    NUM_DECODER_LAYERS: 6
    ADD_PE_FOR_TOKEN: true
    RELATIVE_PE: true
    RELATIVE_PE_DECODER: false
    PRE_PROJECTION: false
    KNN: 128
    S2S_DISTANCE: null
    SELF_ATTN_KNN: 128
    CROSS_ATTN_KNN: 128
    RANDOMIZE_AGENT_ID: true
    A2S_KNN: null
    A2S_DISTANCE: null
    A2A_KNN: null
    A2A_DISTANCE: null
    ADD_RELATION_TO_V: false
    IS_V7: False
    PER_CONTOUR_POINT_RELATION: null

TOKENIZATION:
    TOKENIZATION_METHOD: delta_delta
    NUM_SKIPPED_STEPS: 5
    NUM_BINS: 13
    X_MAX: 3.5  # <<< Deprecated
    X_MIN: -3.5  # <<< Deprecated
    Y_MAX: 3.5  # <<< Deprecated
    Y_MIN: -3.5  # <<< Deprecated
    ADD_NOISE: false
    NOISE_TOPK: 5
    ALLOW_SKIP_STEP: True

    MIN_DISPLACEMENT: 0.1
    MIN_DISPLACEMENT_INIT: null
    MIN_SPEED: null
    SMOOTH_FACTOR: null
    MAX_HEADING_DIFF: null

    USE_CONTOUR_ERROR: True

    VEH_LIMIT: 3.5
    PED_LIMIT: 3.5
    CYC_LIMIT: 3.5

    FLIP_WRONG_HEADING: false
    SHOULD_STANDARDIZE: true

#    MIN_DISPLACEMENT: 0.3
#    MIN_DISPLACEMENT_INIT: 1.0
#    MIN_SPEED: 0.5
#    SMOOTH_FACTOR: null
#    MAX_HEADING_DIFF: 0.3


SAMPLING:
    SAMPLING_METHOD: 'topp'
    TEMPERATURE: 1.0
    TOPP: 0.95


OPTIMIZATION:
#    NUM_EPOCHS: 50
    OPTIMIZER: AdamW
    LR: 0.0003
    WEIGHT_DECAY: 0.0
    GRAD_NORM_CLIP: 1.0
    SCHEDULER: cosine
    WARMUP_STEPS: 2000
#    TRAINING_STEPS: 300000
    USE_FOCAL_LOSS: false

TMP_DIR: "tmp"  # Relative to repo root

ACTION_LABEL:
    USE_ACTION_LABEL: false  # Only valid for turning + acceleration
    USE_SAFETY_LABEL: false
    MASK_PROBABILITY_ACTION_LABEL: 0.0  # Might turn it on
    MASK_PROBABILITY_SAFETY_LABEL: 0.0  # Might turn it on

LANGUAGE_CONDITION: false
FINE_TUNE_BERT: false

MCTS:
  USE_MCTS: False
  MCTS_DEPTH: -1
  MCTS_WIDTH: -1
